<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Indent System - IIT Ropar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E40AF; --navy2:#1E3A8A; --gold:#2563EB; --goldl:#EFF6FF;
  --bg:#F8FAFC; --card:#fff; --ink:#1E293B; --mut:#64748B; --line:#E2E8F0; --line2:#F1F5F9;
  --blue:#1D4ED8; --bluel:#E5EDFD; --green:#16A34A; --greenl:#DCFCE7;
  --amber:#B45309; --amberl:#FEF3C7; --red:#B91C1C; --redl:#FEE2E2; --orange:#C2410C; --orangel:#FFEDD5;
  --gray:#475569; --grayl:#F1F5F9;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --serif:var(--sans);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--sans);margin:0;font-weight:700;color:#0F172A}
h1{font-size:22px;line-height:1.25} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px;border-radius:6px}
a{color:var(--blue)}
.muted{color:var(--mut)} .small{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1} .mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}

/* sidebar layout */
.side{position:fixed;top:0;left:0;bottom:0;width:248px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:20;overflow:auto}
.content{margin-left:248px;min-width:0}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;text-decoration:none;color:var(--ink);padding:2px 8px 18px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--navy);display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;flex:none}
.brand b{font-size:15px;display:block;line-height:1.2;color:#0F172A}
.brand span{font-size:12px;color:var(--mut);display:block;line-height:1.3}
.navlbl{font-size:11.5px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;padding:6px 10px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{white-space:nowrap;background:none;border:0;color:#475569;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:500;display:flex;gap:11px;align-items:center;width:100%;text-align:left}
.nav button:hover{background:var(--line2);color:#0F172A}
.nav button.on{background:var(--navy);color:#fff}
.nav .badge{margin-left:auto;background:#F59E0B;color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:0 7px;line-height:19px}
.side .foot{margin-top:auto;padding-top:16px;display:grid;gap:10px}
.side .foot label{font-size:11.5px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em}
.side .foot select{width:100%;border:1px solid #CBD5E1;border-radius:9px;padding:8px;background:#fff;font-size:13px}
.usercard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.usercard .av{width:34px;height:34px;font-size:12.5px}
.usercard b{display:block;font-size:13.5px;line-height:1.25}.usercard span{font-size:12px;color:var(--mut);line-height:1.25;display:block}
.usercard button{margin-left:auto;background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.usercard button:hover{background:var(--line);color:var(--ink)}
.protonote{font-size:12px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:7px 9px;line-height:1.35}
main{max-width:1180px;margin:0 auto;padding:28px 28px 100px}

/* cards, buttons, chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card.pad{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:9px 16px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover:not([disabled]){background:var(--navy2)}
.btn.sec{background:#fff;color:var(--navy);border-color:#B9C4D4;padding:9px 16px}
.btn.sec.sm{padding:6px 11px}.btn.sec:hover:not([disabled]){background:#F4F7FB}
.btn.danger{background:#fff;color:var(--red);border-color:#E6B3B3}.btn.danger:hover:not([disabled]){background:var(--redl)}
.btn.gold{background:var(--navy);border-color:var(--navy);color:#fff}.btn.gold:hover:not([disabled]){background:var(--navy2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.big{padding:12px 16px;font-size:15.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-gray{background:var(--grayl);color:var(--gray)} .c-blue{background:var(--bluel);color:#1741B0} .c-green{background:var(--greenl);color:#116632}
.c-amber{background:var(--amberl);color:var(--amber)} .c-red{background:var(--redl);color:var(--red)} .c-orange{background:var(--orangel);color:var(--orange)}
.c-solidgreen{background:var(--green);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}

/* login */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 32px 26px}
.login .top1{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login .top1 b{display:block;font-size:16px;color:#0F172A;line-height:1.2}.login .top1 span{font-size:12.5px;color:var(--mut)}
.field{display:grid;gap:5px;margin-bottom:14px}
.field label,.lbl{font-weight:600;font-size:13.5px;color:#2b3648}
.req:after{content:" *";color:var(--red)}
.inp,.sel,.txt{width:100%;border:1px solid #BFC9D8;border-radius:8px;padding:9px 11px;background:#fff}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--navy2);outline:3px solid #cfe0ff;outline-offset:0}
.inp[readonly]{background:#F3F5F8;color:#44506a}
.inp:disabled,.txt:disabled,.sel:disabled{background:#EEF0F4;color:#56627a;cursor:not-allowed;border-color:#D5DBE5}
.txt{min-height:78px;resize:vertical}
.err{display:none;color:var(--red);font-size:12.5px;font-weight:500}
.field.bad .inp,.field.bad .sel,.field.bad .txt{border-color:var(--red);background:#FFF8F8}
.field.bad .err{display:block}
.field.bad .opt span{border-color:var(--red)}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--amberl);color:#6b3d05;border:1px solid #EBCB8B}
.alert.bad{background:var(--redl);color:#7e1717;border:1px solid #EBB5B5}
.alert.info{background:var(--bluel);color:#173a8f;border:1px solid #BFD1F8}
.demo{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.demo .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.demo button{border:1px solid #C4CEDC;background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.demo button:hover{background:#F0F4FA}

/* dashboard */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}
.stat .n{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.stat .t{color:var(--mut);font-size:13.5px}
.stat.act{border-color:#93C5FD;background:#F5F9FF}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;overflow:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 11px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--navy)}
.tabs .ct{font-weight:500;color:var(--mut);margin-left:5px;font-size:12.5px}
.toolbar{display:flex;gap:10px;padding:14px;align-items:center}
.search{position:relative;flex:1;max-width:360px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:34px}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);background:#F8FAFC}
td{padding:13px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{cursor:pointer} tbody tr:hover{background:#F8FAFD}
tbody tr.mine td:first-child{box-shadow:inset 4px 0 0 var(--gold)}
.tnum{font-variant-numeric:tabular-nums}
.empty{padding:46px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:17px;margin-bottom:4px}
.tablewrap{overflow-x:auto}
.mini{display:flex;gap:3px;margin-top:6px}
.mini span{height:5px;flex:1;border-radius:3px;background:var(--line)}
.mini span.d{background:var(--green)}.mini span.c{background:var(--gold)}

/* detail */
.crumb{font-size:13.5px;color:var(--mut);margin-bottom:12px}
.crumb a{cursor:pointer;text-decoration:none}.crumb a:hover{text-decoration:underline}
.head{padding:20px 22px}
.head .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.head .meta div span{display:block;color:var(--mut);font-size:12.5px}
.head .meta div b{font-weight:600}
.stepper{display:flex;margin-top:22px}
.step{flex:1;position:relative;text-align:center;font-size:13px;color:var(--mut)}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}
.step:first-child:before{display:none}
.step .c{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:#fff;border:2px solid #C3CCDA;display:grid;place-items:center;font-size:12px;font-weight:700}
.step.done .c{background:var(--green);border-color:var(--green);color:#fff}
.step.done:before,.step.cur:before{background:var(--green)}
.step.cur .c{border-color:var(--gold);background:var(--goldl);color:#1E40AF;box-shadow:0 0 0 4px rgba(37,99,235,.18)}
.step.cur{color:var(--ink);font-weight:600}
.step.warn .c{border-color:var(--orange);background:var(--orangel);color:var(--orange);box-shadow:none}
.step.bad .c{border-color:var(--red);background:var(--redl);color:var(--red);box-shadow:none}
.step small{display:block;font-weight:500;color:var(--mut);font-size:12px;line-height:1.25}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;margin-top:20px;align-items:start}
.panel{position:sticky;top:20px}
.sec{padding:0}
.sec .sh{padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700;color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec .sb{padding:16px 18px}
.sec.acc .sh{background:var(--bluel);border-left:5px solid var(--blue)} .sec.pur .sh{background:var(--greenl);border-left:5px solid var(--green)}
.sec.fin .sh{background:var(--goldl);border-left:5px solid var(--gold)} .sec.ind .sh{background:#F3F5F8;border-left:5px solid var(--gray)}
.sec.lockd{background:#FAFBFC}
.sec.lockd .sh{background:#F1F3F6;border-left-color:#AEB8C7}
.sec.editing{border-color:var(--gold);box-shadow:0 0 0 2px rgba(37,99,235,.3)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
.kv div span{display:block;color:var(--mut);font-size:12.5px}
.kv div b{font-weight:600;word-break:break-word}
.kv .full{grid-column:1/-1}
.items{font-size:14px;margin-top:6px}
.items th,.items td{padding:8px 10px}.items tbody tr{cursor:default}.items tbody tr:hover{background:none}
.items .r{text-align:right}
.items tfoot td{border-top:2px solid var(--line);font-weight:600}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sign{border:1px dashed #B8C3D4;border-radius:8px;padding:9px 10px;min-height:68px;font-size:13px}
.sign span{display:block;color:var(--mut);font-size:12px}
.sign.ok{border-style:solid;border-color:#9fd1b0;background:#F4FBF6}
.sign.ok b{display:block;color:#116632}
.sign i{font-style:normal;color:var(--mut);font-size:12px;display:block}
.cardtabs{display:flex;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.cardtabs button{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}
.cardtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tl{list-style:none;margin:0;padding:6px 18px 6px 46px;position:relative}
.tl:before{content:"";position:absolute;left:21px;top:16px;bottom:16px;width:2px;background:var(--line)}
.tl li{position:relative;padding:12px 0}
.tl li:before{content:"";position:absolute;left:-32px;top:15px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--navy2)}
.tl li.g:before{border-color:var(--green)}.tl li.o:before{border-color:var(--orange)}.tl li.r:before{border-color:var(--red)}
.tl .rem{margin-top:6px;background:#F5F7FA;border-left:3px solid #C5CFDE;padding:6px 10px;border-radius:0 6px 6px 0;font-size:14px}
.docs{list-style:none;margin:0;padding:6px 0}
.docs li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2)}
.docs li:last-child{border:0}
.docs .ico{width:36px;height:36px;border-radius:8px;background:var(--bluel);color:var(--blue);display:grid;place-items:center;flex:none}

/* action panel */
.ap{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 20px rgba(37,99,235,.1)}
.ap .ah{padding:14px 18px;background:var(--goldl);border-bottom:1px solid #BFDBFE;border-radius:10px 10px 0 0}
.ap .ah h3{color:#1E3A8A}
.ap .ab{padding:16px 18px;display:grid;gap:12px}
.ap .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap .sstat{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#FAFBFD}
.ap .sstat.ok{background:#F4FBF6;border-color:#B5DEC2}
.ap .grp{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.person{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1.5px solid #CBD4E1;border-radius:99px;background:#fff;padding:9px 11px;cursor:pointer;margin-bottom:7px}
.person:hover:not([disabled]){border-color:#8fa5c6}
.person.on{border-color:var(--navy);background:#F3F7FD;box-shadow:0 0 0 2px rgba(15,42,74,.12)}
.person[disabled]{opacity:.55;cursor:not-allowed;background:#F6F7F9}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.av.b{background:var(--blue)}.av.g{background:var(--green)}.av.y{background:var(--amber)}
.person .nm{font-weight:600;line-height:1.25}.person .ds{font-size:12.5px;color:var(--mut)}
.person .st{margin-left:auto;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.person .st.on{color:var(--green)}.person .st.off{color:var(--mut)}
.wait{padding:18px}
.wait .av{width:44px;height:44px}
.gl{font-size:12.5px;color:var(--mut);font-weight:600;margin:10px 0 6px}

/* forms */
.formhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid #B9C4D4;border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.fsec{margin-bottom:16px}
.fsec .sh{background:#fff}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;margin-right:9px;font-family:var(--sans);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-block;border:1.5px solid #BFC9D8;border-radius:999px;padding:6px 14px;font-size:14px;background:#fff}
.opt input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.opt input:focus-visible+span{outline:3px solid #7aa7ff;outline-offset:2px}
.itemtbl input{padding:7px 9px}
.itemtbl td{padding:6px 6px;border:0}.itemtbl th{padding:8px 6px}.itemtbl tbody tr{cursor:default}.itemtbl tbody tr:hover{background:none}
.totals{margin-left:auto;width:290px;margin-top:10px;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .gt{border-top:2px solid var(--navy);margin-top:4px;padding-top:8px;font-weight:700;font-size:16px}
.drop{border:2px dashed #B4C0D2;border-radius:10px;padding:22px;text-align:center;color:var(--mut);cursor:pointer;background:#FAFBFD}
.drop:hover{border-color:var(--navy2);background:#F3F7FD}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--navy)}
.bal{display:flex;justify-content:space-between;align-items:center;margin-top:2px;font-weight:600;font-size:14px;padding:8px 12px;background:#F3F5F8;border-radius:8px}
.stickybar{position:fixed;left:248px;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;z-index:15;}
.stickybar .in{max-width:1124px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.newtab{background:#fff;border:1px solid #BFD1F8;border-left:5px solid var(--blue);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.newtab svg{color:var(--blue);flex:none;margin-top:2px}
.lockchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--gray);background:var(--grayl);border-radius:999px;padding:2px 10px}

/* split views */
.split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.list{max-height:calc(100vh - 290px);min-height:240px;overflow:auto}
.lrow{display:flex;gap:11px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line2);cursor:pointer;width:100%;background:#fff;text-align:left}
.lrow:hover{background:#F8FAFD}.lrow.on{background:#F1F5FC;box-shadow:inset 4px 0 0 var(--navy)}
.lrow .t1{font-weight:600;line-height:1.3}.lrow .t2{font-size:12.5px;color:var(--mut)}
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dtl{padding:20px 22px}
.sechead{font-family:var(--serif);font-weight:700;color:var(--navy);margin:20px 0 8px;font-size:16px}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,24,45,.5);z-index:40;display:flex;padding:18px;overflow:auto}
.ov>*{margin:auto}
.modal{background:#fff;border-radius:12px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.modal .mh{padding:18px 22px 6px}.modal .mb{padding:8px 22px 6px;max-height:68vh;overflow:auto}.modal .mf{padding:16px 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.sum{background:#F5F7FA;border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0 14px;display:grid;gap:3px}
.ropt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1.5px solid #CBD4E1;border-radius:9px;margin-bottom:7px;cursor:pointer}
.ropt.on{border-color:var(--navy);background:#F3F7FD}
.ropt input{margin-top:4px;accent-color:var(--navy)}
.ropt b{display:block}.ropt span{font-size:13px;color:var(--mut)}
.pwd{position:relative}.pwd svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}.pwd input{padding-left:34px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:12px 18px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;max-width:90vw;animation:pop .2s ease-out}
.toast svg{color:#7ee0a3}
.record{background:#fff;max-width:820px;margin:0 auto;border-radius:6px;padding:34px 40px;font-family:Georgia,"Times New Roman",serif;color:#111}
.record h2{text-align:center;font-size:20px;color:#111}
.record table{font-family:var(--sans);font-size:13.5px}
.record td,.record th{border:1px solid #444;padding:6px 8px;background:#fff;color:#111}
.record th{font-weight:700}
.record .sg{font-family:var(--sans);font-size:12.5px;border:1px solid #444;padding:8px;min-height:62px}
.record .sg b{display:block;color:#116632}

@media (max-width:980px){
  .side{position:sticky;width:100%;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .content{margin-left:0}
  .brand{padding:0 6px 0 0}.brand span,.navlbl,.side .foot label,.usercard div,.protonote{display:none}
  .nav{flex-direction:row}.nav button{padding:8px 11px;width:auto}
  .side .foot{margin:0 0 0 auto;padding:0;display:flex;align-items:center}.side .foot select{width:150px}
  .usercard{padding:2px;border:0;background:none}
  .stickybar{left:0}
  .cols,.split{grid-template-columns:1fr}.panel{position:static;order:-1}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .g2,.g3{grid-template-columns:1fr}
  main{padding:18px 14px 100px}
  .stepper{overflow-x:auto;padding-bottom:6px}.step{min-width:92px}
  .signs{grid-template-columns:1fr}
  .list{max-height:320px}
}
@media print{
  body *{visibility:hidden}
  .ov,.ov *{visibility:visible}
  .ov{position:absolute;inset:0;background:#fff;padding:0;display:block}
  .record{box-shadow:none;max-width:none;padding:0}
  .noprint{display:none!important}
}

const stageChip=i=>`<span class="chip ${ST[i.stage].chip}">${esc(ST[i.stage].lbl)}</span>`;
function visible(){

const stepCur=i=>i.stage==="REJECTED"?i.rejIdx:ST[i.stage].step;

function doLogin(){
  const cid=$("#cid").value.trim().toLowerCase(),pw=$("#pw").value;S.lastCid=cid;
  if(!cid||!pw){S.loginErr="Enter your college ID and password.";return render()}
  const p=Object.values(PEOPLE).find(x=>x.cid===cid);
  if(!p){S.loginErr="We could not find that college ID. Check it and try again.";return render()}

function tabsFor(u){
  const t=[["pending","Pending approvals"]];

  else if(u.tiers.includes("hod"))t.push(["dept","Department indents"]);
  else t.push(["handled","Handled by me"]);
  return t;
}
function rowsFor(k){
  const u=me(),all=visible();
  if(k==="pending")return all.filter(needsMe);
  if(k==="mine")return all.filter(i=>i.by===u.id);
  if(k==="handled")return all.filter(i=>!needsMe(i)&&i.history.some(h=>h.pid===u.id));
  return all;
}

/* ---- action panel ---- */
function panelHTML(i){
  const u=me();
  if(i.stage==="DONE")return `<div class="card pad"><span class="chip c-solidgreen">Approved</span><h3 class="mt8">Purchase order ${esc(i.po)} created</h3><p class="muted small">Generated on ${fmt(i.signs.po&&i.signs.po.p_top?i.signs.po.p_top.t:lastT(i))}. The final record has every part and signature.</p><button class="btn" style="width:100%" data-act="record">${ic("file",16)}View final record</button></div>`;
  if(i.stage==="REJECTED")return `<div class="card pad"><span class="chip c-red">Rejected</span><p class="small muted mt8">This indent was rejected. See the History tab for the reason.</p></div>`;
  if(i.holder!==u.id){
    const h=PEOPLE[i.holder]||{name:"Officer",desig:""};
    return `<div class="card wait"><div class="row" style="gap:14px"><div class="av y">${initials(h.name)}</div><div><div class="xs muted">Waiting for</div><b>${esc(h.name)}</b><div class="small muted">${esc(h.desig)}</div></div></div>
     <div class="alert info mt16">${ic("clock",18)}<span>${u.tiers.includes("ind")?"You will see it here when it moves.":"You can act only on indents that are with you."}</span></div></div>`;
  }
  if(i.stage==="RETURNED"||i.stage==="DRAFT"){
    const last=[...i.history].reverse().find(h=>h.type==="o");
    return `<div class="card ap"><div class="ah"><h3>${i.stage==="DRAFT"?"Finish your draft":"Fix and send again"}</h3></div><div class="ab">
      ${last?`<div class="alert warn">${ic("undo",18)}<span><b>${esc(PEOPLE[last.pid]?PEOPLE[last.pid].name:"Reviewer")} sent this back.</b><br>${esc(last.remark)}</span></div>`:""}
      <button class="btn gold" data-act="editind">Edit and resubmit</button></div></div>`;
  }
  const st=ST[i.stage],b=btnState(i),sec=st.sec,d=sec?secData(i,sec):null;
  const bt=(k,cls,icon,label,extra="")=>`<button class="btn ${cls} ${extra}" data-act="btn" data-k="${k}" ${b[k].on?"":`disabled aria-disabled="true"`} title="${esc(b[k].on?"":b[k].why)}">${ic(icon,16)}${label}</button>`;
  let hint="";
  if(!b.approve.on)hint=`Approve turns on after you fill the ${SECNAME[sec]} part. Press Fill form to open it.`;
  else if(st.appr&&st.appr.gen)hint="The purchase order is filled. Press Generate PO to finish.";
  return `<div class="card ap"><div class="ah"><h3>Your action</h3><div class="xs" style="color:#1E40AF">${esc(i.no)} · ${esc(st.lbl)}</div></div><div class="ab">
   ${sec?`<div class="sstat ${d?"ok":""}"><span>${SECNAME[sec]} part</span>${d?`<span class="chip c-green">Filled by ${esc((PEOPLE[d.by]?PEOPLE[d.by].name:"User").split(" ")[0])}</span>`:`<span class="chip c-gray">Not filled</span>`}</div>`:""}
   ${bt("approve","gold","check",b.approve.label,"big")}
   <div class="two">${bt("forward","sec","send","Forward")}${bt("fill","sec","edit",b.fill.label)}</div>
   <div class="two">${bt("revise","sec","undo","Revise")}${bt("reject","danger","x","Reject")}</div>
   ${hint?`<div class="alert info">${ic("info",18)}<span>${hint}</span></div>`:""}
  </div></div>`;
}

/* ---- modal dialogs ---- */
let DLG=null;
function dialog(cfg){
  DLG={cfg,target:null,remarks:"",pw:"",opt:cfg.opts?(cfg.defaultOpt||cfg.opts[0].id):null};
  const g=currentGroups();if(g)DLG.target=autoPick(g,cfg.prefer);
  drawDlg();
}
const currentGroups=()=>{const c=DLG.cfg;return c.opts?c.listFor(DLG.opt):c.groups||null};
function autoPick(groups,prefer){
  const ppl=groups.flatMap(g=>g.ppl).filter(p=>p.avail);
  const pref=(prefer||[]).slice().reverse().find(id=>ppl.some(p=>p.id===id));
  return pref||(ppl.length===1?ppl[0].id:null);
}
const personBtn=(p,on)=>`<button type="button" class="person ${on?"on":""}" ${p.avail?"":"disabled"} data-dp="${p.id}" aria-pressed="${on}"><div class="av ${avc(p)}">${initials(p.name)}</div><div><div class="nm">${esc(p.name)}</div><div class="ds">${esc(p.desig)}</div></div><div class="st ${p.avail?"on":"off"}"><span class="dot"></span>${p.avail?"Available":"On leave"}</div></button>`;
function drawDlg(){
  const c=DLG.cfg,groups=currentGroups();
  $("#modal").innerHTML=`<div class="ov" data-act="ovclose"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
   <div class="mh"><h2 id="mt">${c.title}</h2></div><div class="mb"><div class="sum">${c.lines.map(l=>`<div>${l}</div>`).join("")}</div>
   ${c.opts?`<div class="lbl mb8">${c.optHeading}</div>${c.opts.map(o=>`<label class="ropt ${DLG.opt===o.id?"on":""}"><input type="radio" name="dopt" value="${o.id}" ${DLG.opt===o.id?"checked":""}><div><b>${o.label}</b><span>${o.desc}</span></div></label>`).join("")}`:""}
   ${groups?`<div class="field" id="tgField" style="margin-top:6px"><div class="lbl">${c.heading}</div>${groups.length?groups.map(g=>`${g.label?`<div class="gl">${g.label}</div>`:""}${g.ppl.map(p=>personBtn(p,DLG.target===p.id)).join("")}`).join(""):`<div class="muted small">No one is available for this step.</div>`}
     <div class="err" id="tgErr">Pick one person to continue.</div></div>`:""}
   <div class="field" id="remField"><label class="lbl" for="drem">Remarks ${c.needRem?"(required)":"(optional)"}</label><textarea class="txt" id="drem" placeholder="${esc(c.remPh||"Add a note for the next person.")}">${esc(DLG.remarks)}</textarea><div class="err" id="remErr">${esc(c.remErr||"Add a remark.")}</div></div>
   <div class="field" id="pwField"><label class="lbl" for="cpw">Confirm with your password</label><div class="pwd">${ic("lock",16)}<input class="inp" id="cpw" type="password" autocomplete="current-password" placeholder="Your password" value="${esc(DLG.pw)}"></div><div class="err" id="pwErr">Enter your password to confirm.</div></div>
   <div class="xs muted">Your name, role and time are saved. Demo mode: any password works.</div></div>
   <div class="mf"><button class="btn sec" data-act="closemodal">Cancel</button><button class="btn ${c.danger?"danger":c.gold?"gold":""}" id="dlgOk">${c.btn}</button></div></div></div>`;
  setTimeout(()=>{const t=$("#drem")&&!c.groups&&!c.opts&&c.needRem?$("#drem"):$("#cpw");if(t&&!c.groups&&!c.opts)t.focus({preventScroll:true})},30);
}
function dlgSubmit(){
  const c=DLG.cfg,groups=currentGroups();DLG.remarks=$("#drem").value.trim();DLG.pw=$("#cpw").value;
  let bad=false;
  if(groups){const ok=!!DLG.target;$("#tgField").classList.toggle("bad",!ok);if(!ok)bad=true}
  if(c.needRem){const ok=!!DLG.remarks;$("#remField").classList.toggle("bad",!ok);if(!ok)bad=true}
  if(!DLG.pw){$("#pwField").classList.add("bad");bad=true}else $("#pwField").classList.remove("bad");
  if(bad)return;
  const r={target:DLG.target&&PEOPLE[DLG.target],remarks:DLG.remarks,opt:DLG.opt};
  closeModal();c.onOk(r);
}
const closeModal=()=>{$("#modal").innerHTML="";DLG=null};
function toast(msg){const t=$("#toast");t.innerHTML=`<div class="toast">${ic("check",18)}<span>${esc(msg)}</span></div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML="",3600)}
const sumLines=i=>[`<b>${esc(i.no)}</b> · ${esc(i.title)}`,`Amount: ${inr(i.total)}`];
const tp2=p=>`${p.name}, ${p.desig}`;

/* ---- workflow actions ---- */
function pressButton(k){
  const i=byId(S.id),st=ST[i.stage],b=btnState(i);
  if(!b[k].on)return;
  if(k==="fill"){go("fill");return}
  const trailIds=i.trail.map(t=>t.pid);
  if(k==="approve"){
    if(st.appr.gen)return dialog({title:"Generate purchase order",lines:[...sumLines(i),"A purchase order number is created and the indent is completed."],btn:"Generate PO",gold:1,remPh:"Optional note for the record.",onOk:r=>generatePO(i,r)});
    return dialog({title:st.appr.title,lines:sumLines(i),heading:"Send to",groups:groupsFor(st.appr.to,i),prefer:trailIds,btn:st.appr.label||"Approve",gold:1,onOk:r=>doApprove(i,r)});
  }
  if(k==="forward")return dialog({title:"Forward to a lower official",lines:[...sumLines(i),"They fill their part or send it further down. It comes back to you."],heading:"Forward to",groups:groupsFor(st.fwd,i),prefer:trailIds,btn:"Forward",onOk:r=>doForward(i,r)});
  if(k==="revise"){
    const seen=new Set([S.user]),ppl=[];
    const ind=PEOPLE[i.by]||{id:i.by,name:"Indenter",desig:""};seen.add(ind.id);
    i.trail.forEach(t=>{if(!seen.has(t.pid)&&PEOPLE[t.pid]){seen.add(t.pid);ppl.push(PEOPLE[t.pid])}});
    return dialog({title:"Revise: send back for correction",lines:sumLines(i),heading:"Send back to anyone earlier in the path",groups:[{label:"Indenter",ppl:[ind]},...(ppl.length?[{label:"Earlier in the path",ppl}]:[])],needRem:1,remErr:"Tell them what to change.",remPh:"What needs to be corrected?",btn:"Send back",onOk:r=>doRevise(i,r)});
  }
  if(k==="reject")return dialog({title:"Reject this indent",lines:[...sumLines(i),"The indenter will see the rejection and your reason."],needRem:1,remErr:"Give the reason for rejecting.",remPh:"Why is this indent rejected?",danger:1,btn:"Reject",onOk:r=>doReject(i,r)});
}
const groupsFor=(tiers,i)=>tiers.map(t=>({label:TIER_LABEL[t],ppl:peopleFor([t],i).filter(p=>p.id!==S.user)})).filter(g=>g.ppl.length);
function setSign(i,u,now){
  const st=ST[i.stage];
  if(i.stage==="HOD")i.signs.hod={pid:u.id,t:now};
  else if(i.stage==="FINAL")i.signs.fin={pid:u.id,t:now};
  else if(st.sec){i.signs[st.sec]=i.signs[st.sec]||{};i.signs[st.sec][st.tier]={pid:u.id,t:now}}
}
function doApprove(i,r){
  const u=me(),st=ST[i.stage],now=new Date().toISOString(),tp=r.target;
  setSign(i,u,now);
  const text=i.stage==="HOD"?`Approved and sent to ${tp2(tp)}`:i.stage==="FINAL"?`Approved and sent back to ${tp2(tp)} for the purchase order`:
    st.appr.label?`Sent back to ${tp2(tp)}`:st.appr.next&&ST[st.appr.next].step===st.step&&ST[st.appr.next].tier!==st.tier&&["a_mid","a_top","p_mid","p_top"].includes(ST[st.appr.next].tier)?`Approved and sent back to ${tp2(tp)}`:`Approved and sent to ${tp2(tp)}`;
  i.history.push({pid:u.id,type:"g",text,remark:r.remarks,t:now});
  i.trail.push({pid:u.id,stage:i.stage});i.holder=tp.id;i.stage=st.appr.next;
  saveStorage();
  toast(`Sent to ${tp.name}`);S.view="dash";S.filter="pending";render();window.scrollTo(0,0);
}
function doForward(i,r){
  const u=me(),st=ST[i.stage],tp=r.target,now=new Date().toISOString();
  const tier=st.fwd.find(t=>tp.tiers.includes(t));
  const skip=(i.stage==="A_TOP"&&tier==="a_low")?", skipping JAO/AO":(i.stage==="P_TOP"&&tier==="p_low")?", skipping JS/Supdt.":(i.stage==="PO_TOP"&&tier==="p_low")?", skipping JS/Supdt.":"";
  i.history.push({pid:u.id,type:"y",text:`Forwarded to ${tp2(tp)}${skip}`,remark:r.remarks,t:now});
  i.trail.push({pid:u.id,stage:i.stage});i.holder=tp.id;i.stage=STG[st.sec][tier];
  saveStorage();
  toast(`Forwarded to ${tp.name}`);S.view="dash";S.filter="pending";render();window.scrollTo(0,0);
}
function doRevise(i,r){
  const u=me(),tp=r.target,now=new Date().toISOString();
  i.history.push({pid:u.id,type:"o",text:`Sent back for revision to ${tp2(tp)}`,remark:r.remarks,t:now});
  const k=i.trail.findIndex(t=>t.pid===tp.id);
  if(tp.id===i.by||k<0){i.stage="RETURNED";i.holder=i.by;i.trail=[]}
  else{const e=i.trail[k];i.stage=e.stage;i.holder=e.pid;i.trail=i.trail.slice(0,k)}
  saveStorage();
  toast(`Sent back to ${tp.name}`);S.view="dash";S.filter="pending";render();window.scrollTo(0,0);
}
function doReject(i,r){
  const u=me();
  i.history.push({pid:u.id,type:"r",text:"Rejected the indent",remark:r.remarks,t:new Date().toISOString()});
  i.rejIdx=ST[i.stage].step;i.stage="REJECTED";i.holder=null;
  saveStorage();
  toast("Indent rejected");S.view="dash";render();window.scrollTo(0,0);
}
function generatePO(i,r){
  const u=me(),now=new Date().toISOString();
  setSign(i,u,now);i.po="PO/2026/"+String(430+Math.floor(Math.random()*60)).padStart(4,"0");
  i.history.push({pid:u.id,type:"g",text:`Generated purchase order ${i.po}`,remark:r.remarks,t:now});
  i.stage="DONE";i.holder=null;
  saveStorage();
  toast(`${i.po} generated`);render();
}

const chkf=(name,label,on,dis)=>`<label class="chk"><input type="checkbox" data-ff="${name}" ${on?"checked":""} ${dis?"disabled":""}><span>${label}</span></label>`;

function secAcct(d,dis,i){

   <div class="bal"><span>Balance budget</span><span id="balOut" class="tnum">${dis||v("available")===""?"Shown after you fill the amounts":inr(a-b)}</span></div>`;

function secPur(d,dis,i){

function secPO(d,dis,i){

function secInd(i){

function fillCard(cls,title,editing,body,note){
  return `<div class="card sec ${cls} ${editing?"editing":"lockd"} fsec" ${editing?"data-edit":""}><div class="sh"><span>${title}</span>${editing?`<span class="chip c-amber">You are editing this part</span>`:`<span class="lockchip">${ic("lock",13)}Locked${note?" · "+esc(note):""}</span>`}</div><div class="sb">${body}</div></div>`;

function fillView(){
  const i=byId(S.id);if(!i||i.holder!==S.user||!ST[i.stage].sec){return `<div class="empty"><b>Nothing to fill</b>This indent is not waiting for you.</div>`}
  const sec=ST[i.stage].sec,showPO=sec==="po"||i.poData;

   <div class="newtab">${ic("file",20)}<div><b>Form opened · ${esc(i.no)} · ${esc(i.form)}</b><div class="small muted">Only the ${SECNAME[sec]} part can be edited. After you save, this tab closes and the indent page updates.</div></div></div>
   ${fillCard("ind","Indenter part",false,secInd(i),"filled by "+(PEOPLE[i.by]?PEOPLE[i.by].name:"Indenter"))}
   ${fillCard("acc","Accounts part",sec==="acct",secAcct(i.acct,sec!=="acct",i),sec==="acct"?"":by("acct"))}

   ${showPO?fillCard("fin","Purchase order",sec==="po",secPO(i.poData,sec!=="po",i),sec==="po"?"":by("poData")):""}`;

const fillBar=()=>`<div class="stickybar"><div class="in"><div class="muted small">Your changes are saved to the indent when you press Save and close.</div><div class="row"><button class="btn sec" data-act="fillcancel">Cancel</button><button class="btn gold" data-act="fillsave">${ic("check",16)}Save and close</button></div></div></div>`;

function initFill(){
  const calcBal=()=>{
    const av=$('[data-ff="available"]'), bk=$('[data-ff="booked"]'), out=$("#balOut");
    if(av&&bk&&out){
      const a=parseFloat(av.value)||0, b=parseFloat(bk.value)||0;
      out.textContent=inr(a-b);
    }
  };
  const av=$('[data-ff="available"]'), bk=$('[data-ff="booked"]');
  if(av&&bk){ av.addEventListener("input",calcBal); bk.addEventListener("input",calcBal); }
}

function saveFillData(){
  const i=byId(S.id), sec=ST[i.stage].sec;
  if(sec==="acct"){
    const h=$('[data-ff="head"]').value.trim(), s=parseFloat($('[data-ff="sanctioned"]').value)||0, a=parseFloat($('[data-ff="available"]').value)\vert{}\vert{}0, b=parseFloat($('[data-ff="booked"]').value)||0;
    if(!h||isNaN(a)){ toast("Please enter valid budget details."); return; }
    i.acct={head:h,sanctioned:s,available:a,booked:b,by:S.user,t:new Date().toISOString()};
  } else if(sec==="pur"){
    const q=$('[data-ff="quote"]').checked, c=$('[data-ff="calc"]').checked, o=$('[data-ff="order"]').checked, p=$('[data-ff="pages"]').value.trim(), cfa=parseFloat($('[data-ff="cfa"]').value)||0;
    if(!q||!c||!o){ toast("Please confirm all check items."); return; }
    i.pur={quote:q,calc:c,order:o,pages:p||"1 to 4",cfa,by:S.user,t:new Date().toISOString()};
  } else if(sec==="po"){
    const dt=$('[data-ff="date"]').value, delTo=$('[data-ff="deliverTo"]').value.trim(), delBy=$('[data-ff="deliveryBy"]').value.trim(), pay=$('[data-ff="payment"]').value.trim(), trm=$('[data-ff="terms"]').value.trim();
    i.poData={date:dt,vendor:i.vendor,deliverTo:delTo,deliveryBy:delBy,payment:pay,terms:trm,by:S.user,t:new Date().toISOString()};
  }
  saveStorage();
  toast("Section saved successfully.");
  go("detail", i.id);
}

    <div class="g2 mt16">
      <div class="field"><label class="lbl req">Title / Major item name</label><input class="inp" id="f_title" placeholder="e.g. Oscilloscope 100MHz"></div>
      <div class="field"><label class="lbl req">Category</label><select class="sel" id="f_cat"><option value="Non-consumables">Non-consumables</option><option value="Consumables">Consumables</option></select></div>
    </div>
    <div class="g2">
      <div class="field"><label class="lbl req">Budget head</label><input class="inp" id="f_bhead" value="Departmental grant, ${u.dept}"></div>
      <div class="field"><label class="lbl req">Sanctioned budget (₹)</label><input class="inp" id="f_sanc" type="number" value="500000"></div>
    </div>
    <div class="field"><label class="lbl req">Purpose / Justification</label><textarea class="txt" id="f_purp" placeholder="Describe why this purchase is required..."></textarea></div>
  </div>

  <div class="card pad mb16"><h3>2. Line items & vendor quote</h3>
    <table class="items itemtbl mt16" id="f_tbl"><thead><tr><th>Description</th><th style="width:90px" class="r">Qty</th><th style="width:130px" class="r">Rate (₹)</th><th style="width:130px" class="r">Amount</th><th style="width:40px"></th></tr></thead>
    <tbody id="f_tbody"></tbody></table>
    <button class="btn sec sm mt8" data-act="additem">${ic("plus",14)}Add item row</button>
    <div class="totals">
      <div><span>Subtotal:</span><span id="f_sub" class="tnum">₹0</span></div>
      <div class="row between"><span>GST Rate:</span><select id="f_gst" class="sel" style="width:80px;padding:2px 6px"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option></select></div>
      <div class="gt"><span>Total Amount:</span><span id="f_tot" class="tnum">₹0</span></div>
    </div>
    <div class="g2 mt16">
      <div class="field"><label class="lbl req">Vendor name (M/s)</label><input class="inp" id="f_vname" placeholder="e.g. Tek Instruments"></div>
      <div class="field"><label class="lbl req">Quotation reference & date</label><input class="inp" id="f_qref" placeholder="e.g. TKI/9912 dated 2026-09-30"></div>
    </div>
  </div>`;
}
const formBar=()=>`<div class="stickybar"><div class="in"><div class="muted small">All required fields marked with * must be filled before submitting.</div><div class="row"><button class="btn sec" data-act="nav" data-to="dash">Cancel</button><button class="btn gold" data-act="submitind">${ic("send",16)}Submit to HOD</button></div></div></div>`;

function initForm(){
  renderFormRows();
}
function renderFormRows(){
  const tb=$("#f_tbody");if(!tb)return;
  tb.innerHTML=FORM_ITEMS.map((it,k)=>`<tr>
    <td><input class="inp" value="${esc(it.d)}" oninput="FORM_ITEMS[${k}].d=this.value"></td>
    <td><input class="inp tnum" type="number" min="1" value="${it.q}" oninput="FORM_ITEMS[${k}].q=parseFloat(this.value)||0; calcFormTotals()"></td>
    <td><input class="inp tnum" type="number" min="0" value="${it.r}" oninput="FORM_ITEMS[${k}].r=parseFloat(this.value)||0; calcFormTotals()"></td>
    <td class="r tnum" style="padding-top:14px">${inr(it.q*it.r)}</td>
    <td>${FORM_ITEMS.length>1?`<button class="btn danger sm" onclick="FORM_ITEMS.splice(${k},1); renderFormRows(); calcFormTotals()">${ic("trash",14)}</button>`:""}</td>
  </tr>`).join("");
  calcFormTotals();
}
function calcFormTotals(){
  const sub=FORM_ITEMS.reduce((s,i)=>s+(i.q*i.r),0);
  const gstEl=$("#f_gst");
  const gst=gstEl?parseFloat(gstEl.value)||0:18;
  const tot=Math.round(sub*(1+gst/100));
  if($("#f_sub")) $("#f_sub").textContent=inr(sub);
  if($("#f_tot")) $("#f_tot").textContent=inr(tot);
}

function submitNewIndent(){
  const u=me(), title=$("#f_title").value.trim(), cat=$("#f_cat").value, bhead=$("#f_bhead").value.trim(), sanc=parseFloat($("#f_sanc").value)\vert{}\vert{}0, purp=$("#f_purp").value.trim(), vname=$("#f_vname").value.trim(), qref=$("#f_qref").value.trim();
  if(!title||!purp||!vname){ toast("Please fill in all mandatory fields."); return; }
  const validItems=FORM_ITEMS.filter(i=>i.d.trim()&&i.q>0&&i.r>0);
  if(!validItems.length){ toast("Please add at least one item with description, qty, and rate."); return; }

  const hod=hodFor(u);
  const newInd=mkIndent({
    no:"IND-2026-0"+(seq+1),
    title, by:u.id, form:S.formType, cat, purpose:purp, budgetHead:bhead, sanctioned:sanc,
    research:S.formType.includes("(R)")?"Yes":"No", items:validItems, vendor:vname, qno:qref, stage:"HOD", holder:hod.id,
    history:[H(u.id,"y","Created the indent and submitted it to HOD","",0)]
  });
  IND.unshift(newInd);
  saveStorage();
  toast(`Indent ${newInd.no} submitted to HOD ${hod.name}`);
  go("dash");
}

/* ---- Admin Views ---- */
function aindView(){
  const q=S.aq.trim().toLowerCase();
  let rows=visible().filter(i=>!q||(i.no+i.title+(PEOPLE[i.by]?PEOPLE[i.by].name:"")).toLowerCase().includes(q));
  return `<div class="hello"><div><h1>All System Indents</h1><div class="muted">Admin audit view of all purchases across campus.</div></div></div>
   <div class="card"><div class="toolbar"><div class="search" style="max-width:480px">${ic("search",16)}<input class="inp" id="aq" placeholder="Search by number, item, or staff member" value="${esc(S.aq)}" aria-label="Admin search"></div></div>
   <div class="tablewrap">${indentTable(rows)}</div></div>`;
}

function usersView(){
  const q=S.uq.trim().toLowerCase();
  const list=Object.values(PEOPLE).filter(p=>!q||(p.name+p.cid+p.dept+p.desig).toLowerCase().includes(q));
  return `<div class="hello"><div><h1>User Management</h1><div class="muted">Authorize pending users and assign system permissions.</div></div></div>
  <div class="card"><div class="toolbar"><div class="search" style="max-width:480px">${ic("search",16)}<input class="inp" id="uq" placeholder="Search user accounts" value="${esc(S.uq)}"></div></div>
  <div class="tablewrap"><table><thead><tr><th>Name / ID</th><th>Designation</th><th>Department</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
  <tbody>${list.map(p=>`<tr>
    <td><b>${esc(p.name)}</b><div class="xs muted">${esc(p.cid)}</div></td>
    <td>${esc(p.desig)}</td><td>${esc(p.dept)}</td>
    <td><span class="chip c-blue">${esc(roleLabel(p))}</span></td>
    <td><span class="chip ${p.status==="authorised"?"c-green":p.status==="pending"?"c-amber":"c-red"}">${esc(p.status)}</span></td>
    <td>${p.status==="pending"?`<button class="btn sm gold" onclick="PEOPLE['${p.id}'].status='authorised'; toast('User authorised'); render()">Authorise</button>`:`<button class="btn sec sm" onclick="PEOPLE['${p.id}'].status=PEOPLE['${p.id}'].status==='authorised'?'blocked':'authorised'; render()">${p.status==="authorised"?"Block":"Unblock"}</button>`}</td>
  </tr>`).join("")}</tbody></table></div></div>`;
}

/* ---- printable record modal ---- */
function showRecordModal(i){
  $("#modal").innerHTML=`<div class="ov" data-act="closemodal"><div class="modal record" style="max-width:860px" onclick="event.stopPropagation()">
    <div class="row between noprint" style="margin-bottom:20px"><h3>Official Purchase Indent Record</h3><div><button class="btn sec sm" onclick="window.print()">${ic("print",16)}Print / Export PDF</button> <button class="btn sec sm" data-act="closemodal">Close</button></div></div>
    <h2>INDIAN INSTITUTE OF TECHNOLOGY ROPAR</h2><div style="text-align:center;font-size:13px;margin-bottom:18px">STORES & PURCHASE SECTION</div>
    <table style="width:100%;margin-bottom:14px">
      <tr><td><b>Indent No:</b> ${esc(i.no)}</td><td><b>Date:</b> ${fmt(i.history[0]?i.history[0].t:ago(0))}</td><td><b>Form:</b> ${esc(i.form)}</td></tr>
      <tr><td colspan="2"><b>Indenter:</b> ${esc(PEOPLE[i.by]?PEOPLE[i.by].name:"Indenter")}, ${esc(PEOPLE[i.by]?PEOPLE[i.by].desig:"")}</td><td><b>Dept:</b> ${esc(PEOPLE[i.by]?PEOPLE[i.by].dept:"CSE")}</td></tr>
      <tr><td colspan="3"><b>Item Description:</b> ${esc(i.title)}</td></tr>
      <tr><td colspan="3"><b>Purpose:</b> ${esc(i.purpose)}</td></tr>
      <tr><td><b>Vendor:</b> ${esc(i.vendor)}</td><td colspan="2"><b>Quotation Ref:</b> ${esc(i.qno)}</td></tr>
    </table>
    <table style="width:100%;margin-bottom:16px"><thead><tr><th>S.N.</th><th>Description</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Total</th></tr></thead><tbody>
      ${i.items.map((x,k)=>`<tr><td>${k+1}</td><td>${esc(x.d)}</td><td style="text-align:right">${x.q}</td><td style="text-align:right">${inr(x.r)}</td><td style="text-align:right">${inr(x.q*x.r)}</td></tr>`).join("")}
      <tr><td colspan="4" style="text-align:right"><b>Grand Total (Incl. Taxes):</b></td><td style="text-align:right"><b>${inr(i.total)}</b></td></tr>
    </tbody></table>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px">
      <div class="sg"><span>Indenter</span><b>${esc(PEOPLE[i.by]?PEOPLE[i.by].name:"Indenter")}</b><i>Verified</i></div>
      <div class="sg"><span>HOD</span>${i.signs.hod?`<b>${esc(PEOPLE[i.signs.hod.pid]?PEOPLE[i.signs.hod.pid].name:"HOD")}</b><i>Signed</i>`:"Pending"}</div>
      <div class="sg"><span>Registrar / Sanction Authority</span>${i.signs.fin?`<b>${esc(PEOPLE[i.signs.fin.pid]?PEOPLE[i.signs.fin.pid].name:"Registrar")}</b><i>Approved</i>`:"Pending"}</div>
    </div>
  </div></div>`;
}

/* ============ event listeners ============ */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;
  if(act==="nav") go(t.dataset.to);
  else if(act==="logout"){ S.user=null; S.view="login"; render(); }
  else if(act==="demoid"){ S.lastCid=t.dataset.cid; if($("#cid")) $("#cid").value=t.dataset.cid; }
  else if(act==="switch"){ S.user=t.value; render(); }
  else if(act==="filter"){ S.filter=t.dataset.k; render(); }
  else if(act==="open"){ go("detail", t.dataset.id); }
  else if(act==="tab"){ S.tab=t.dataset.k; render(); }
  else if(act==="btn"){ pressButton(t.dataset.k); }
  else if(act==="fillcancel"){ go("detail", S.id); }
  else if(act==="fillsave"){ saveFillData(); }
  else if(act==="record"){ showRecordModal(byId(S.id)); }
  else if(act==="closemodal"||act==="ovclose"){ if(e.target===t||act==="closemodal") closeModal(); }
  else if(act==="setft"){ S.formType=t.dataset.v; render(); }
  else if(act==="additem"){ FORM_ITEMS.push({d:"",q:1,r:0}); renderFormRows(); }
  else if(act==="submitind"){ submitNewIndent(); }
  else if(act==="adddoc"){
    const i=byId(S.id);
    i.docs.push({n:"Attached-Quote-Ref-"+Math.floor(Math.random()*1000)+".pdf",s:"145 KB",by:S.user});
    saveStorage();
    toast("Document attached."); render();
  }
});

document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.q=e.target.value; render(); }
  else if(e.target.id==="tq"){ S.tq=e.target.value; render(); }
  else if(e.target.id==="aq"){ S.aq=e.target.value; render(); }
  else if(e.target.id==="uq"){ S.uq=e.target.value; render(); }
});

document.addEventListener("change", e=>{
  if(e.target.name==="dopt"&&DLG){ DLG.opt=e.target.value; drawDlg(); }
});

document.addEventListener("click", e=>{
  const p=e.target.closest("[data-dp]");
  if(p&&DLG){ DLG.target=p.dataset.dp; drawDlg(); }
  if(e.target.id==="dlgOk"){ dlgSubmit(); }
});

/* Initialize */
S.user="p_ind";
go("dash");
</script>
</body>
</html>
